name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLite for repository tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  native:
    name: Build llama.cpp bridge (Linux compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S packages/medha_llama/src -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
      - run: cmake --build build/native --target medha_llama
      - name: Check exported symbols
        run: |
          for s in medha_load medha_free medha_format_chat medha_begin medha_next medha_prompt_tokens medha_last_error; do
            nm -D --defined-only build/native/libmedha_llama.so | grep -q " $s$" || { echo "missing $s"; exit 1; }
          done
