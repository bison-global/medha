name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLite for repository tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          # Report each problem as an annotation so it shows on the PR.
          dart analyze --format=machine > analyze.txt 2>&1 || true
          awk -F'|' 'NF>=8 && $1!="INFO" { lvl = ($1=="ERROR") ? "error" : "warning"; sub(/^.*\/medha\//, "", $4); printf "::%s file=%s,line=%s,col=%s::%s (%s)\n", lvl, $4, $5, $6, $8, $3 }' analyze.txt
          flutter analyze --no-fatal-infos
      - name: Test
        id: test
        continue-on-error: true
        run: |
          flutter test --machine > test.jsonl || status=$?
          # One annotation per failing test, with its error message.
          jq -rR 'fromjson? | select(.type=="testStart") | [.test.id, .test.name] | @tsv' test.jsonl > names.tsv
          jq -rR 'fromjson? | select(.type=="error") | [.testID, (.error | gsub("\n"; " ") | .[0:400])] | @tsv' test.jsonl |
            while IFS=$'\t' read -r id err; do
              name=$(awk -F'\t' -v id="$id" '$1==id {print $2}' names.tsv)
              echo "::error title=Test failed::${name}: ${err}"
            done
          exit ${status:-0}
      - name: Fail if analyze or tests failed
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        run: exit 1

  native:
    name: Build llama.cpp bridge (Linux compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S packages/medha_llama/src -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
      - run: cmake --build build/native --target medha_llama
      - name: Check exported symbols
        run: |
          for s in medha_load medha_free medha_format_chat medha_begin medha_next medha_prompt_tokens medha_last_error; do
            nm -D --defined-only build/native/libmedha_llama.so | grep -q " $s$" || { echo "missing $s"; exit 1; }
          done
